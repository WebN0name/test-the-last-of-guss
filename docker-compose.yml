services:
  postgres:
    image: postgres:16-alpine
    container_name: guss-postgres
    environment:
      POSTGRES_USER: guss
      POSTGRES_PASSWORD: guss
      POSTGRES_DB: guss
    ports:
      - "5432:5432"
    volumes:
      - guss-pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guss -d guss"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  guss-pgdata:
